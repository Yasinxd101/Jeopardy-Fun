// Teams share a score. Off by default, because most games are free-for-all.
function teamSetupHtml() {
  if (state.players.length < 2) return "";   // teams need at least two people
  var on = !!state.teamMode;
  var head = '<button class="team-toggle' + (on ? ' team-toggle-on' : '') + '" data-action="toggleTeamMode">' +
      '<span class="play-opt-tick">' + (on ? '&#10003;' : '') + '</span>' +
      '<span class="play-opt-text">' +
        '<span class="play-opt-title">Play in teams</span>' +
        '<span class="play-opt-sub">Teammates share one score and take turns as a side.</span>' +
      '</span>' +
    '</button>';
  if (!on) return '<div class="team-setup">' + head + '</div>';
  reconcileTeams();
  var count = state.teams.length;
  var maxTeams = Math.min(4, state.players.length);
  var sizer = '<div class="team-count">' +
    '<span class="builder-cat-pos">' + count + ' teams</span>' +
    '<button class="builder-cat-move" data-action="setTeamCount" data-n="' + (count - 1) + '"' +
      (count <= 2 ? ' disabled' : '') + ' aria-label="Fewer teams">&minus;</button>' +
    '<button class="builder-cat-move" data-action="setTeamCount" data-n="' + (count + 1) + '"' +
      (count >= maxTeams ? ' disabled' : '') + ' aria-label="More teams">+</button>' +
  '</div>';
  var cols = state.teams.map(function (team, t) {
    var chips = team.members.map(function (i) {
      var p = state.players[i];
      if (!p) return "";
      return '<button class="feud-chip" data-action="moveToTeam" data-i="' + i + '" data-t="' + ((t + 1) % count) + '">' +
        avatarHtml(p, 12) + '<span class="feud-chip-name">' + esc(p.name) + '</span>' +
        '<span class="feud-chip-move">&rarr;</span>' +
      '</button>';
    }).join("");
    if (!team.members.length) chips = '<p class="muted" style="margin:6px 0;font-size:12px">Nobody yet</p>';
    return '<div class="feud-team-col">' +
      '<p class="feud-team-head">' + esc(team.name) + '</p>' + chips +
    '</div>';
  }).join("");
  var empty = state.teams.some(function (t) { return !t.members.length; });
  return '<div class="team-setup">' + head + sizer +
    '<div class="team-cols">' + cols + '</div>' +
    (empty ? '<p class="err">Every team needs at least one player.</p>' : '') +
    '<p class="builder-hint-note">Tap a name to send it to the next team.</p>' +
  '</div>';
}

// One decision up front: are people buzzing in on their phones, or is everyone

// All-time stats and recent matches, aggregated from local history.
function viewStats() {
  var hist = jfRead(JF_HISTORY_KEY, []);
  if (!Array.isArray(hist)) hist = [];
  var agg = {};
  // History is read straight off the device and can hold records from older
  // versions or a game that was interrupted mid-write, so every field here is
  // treated as optional: one bad row must not take the whole screen down.
  hist.forEach(function (m) {
    if (!m || !Array.isArray(m.players)) return;
    var winners = Array.isArray(m.winners) ? m.winners : [];
    m.players.forEach(function (p) {
      if (!p || typeof p.name !== "string" || !p.name) return;
      var score = typeof p.score === "number" && isFinite(p.score) ? p.score : 0;
      var k = p.name.toLowerCase();
      if (!agg[k]) agg[k] = { name: p.name, games: 0, wins: 0, points: 0, best: -Infinity };
      agg[k].games++;
      agg[k].points += score;
      if (score > agg[k].best) agg[k].best = score;
      if (winners.some(function (w) { return typeof w === "string" && w.toLowerCase() === k; })) agg[k].wins++;
    });
  });
  var players = Object.keys(agg).map(function (k) { return agg[k]; })
    .sort(function (a, b) { return b.wins - a.wins || b.points - a.points; });

  var playerRows = players.map(function (p, i) {
    return '<div class="row-item">' +
      '<span style="font-weight:900;color:#6a72a8;min-width:20px">' + (i + 1) + '.</span>' +
      '<span style="flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">' + esc(p.name) + '</span>' +
      '<span style="color:#aab0d8;font-size:12px;font-weight:700">' + p.wins + 'W / ' + p.games + 'G</span>' +
      '<span style="color:#7ee2b0;font-size:12px;font-weight:800;min-width:70px;text-align:right">best ' + p.best + '</span>' +
    '</div>';
  }).join("");
  if (!players.length) playerRows = '<p class="muted">No finished games yet. Stats appear after your first Final Jeopardy.</p>';

  var matchRows = hist.slice(0, 12).map(function (m) {
    if (!m || !Array.isArray(m.players)) return "";
    var d = new Date(m.at);
    var when = isFinite(d.getTime()) ? (d.getMonth() + 1) + "/" + d.getDate() : "";
    var boards = Array.isArray(m.boards) ? m.boards.filter(Boolean) : [];
    var winners = Array.isArray(m.winners) ? m.winners.filter(Boolean) : [];
    var line = m.players.filter(function (p) { return p && p.name; })
      .map(function (p) { return esc(p.name) + ' ' + (typeof p.score === "number" ? p.score : 0); }).join(' &middot; ');
    return '<div class="search-hit" style="cursor:default;border-left-color:#ffd166">' +
      '<div class="search-hit-meta">' + when + (boards.length ? ' &middot; ' + esc(boards.join(" + ")) : '') + '</div>' +
      '<div class="search-hit-q">' + line + '</div>' +
      (winners.length ? '<div class="search-hit-a">Winner: ' + esc(winners.join(" & ")) + '</div>' : '') +
    '</div>';
  }).join("");
  if (!matchRows) matchRows = '<p class="muted">Match history shows up here.</p>';

  return '<div class="wrap"><div class="inner" style="max-width:520px;margin:0 auto">' +
    '<h1 class="title" style="font-size:34px">STATS &amp; HISTORY</h1>' +
    '<p class="sub">All-time records on this device.</p>' +
    '<div class="card">' +
      '<p class="lbl" style="display:block;margin-bottom:10px">LEADERBOARD</p>' +
      '<div style="display:flex;flex-direction:column;gap:8px">' + playerRows + '</div>' +
      '<p class="lbl" style="display:block;margin:18px 0 4px">RECENT MATCHES</p>' +
      matchRows +
      (state.statsMsg ? '<p class="muted" style="margin-top:12px">' + esc(state.statsMsg) + '</p>' : '') +
      '<button class="big-gold" data-action="closeStats">Back</button>' +
      (hist.length
        ? '<button class="danger-link" data-action="confirmClearHistory">' +
            'Clear all history (' + hist.length + ' game' + (hist.length === 1 ? '' : 's') + ')</button>'
        : '') +
    '</div>' +
  '</div></div>';
}

// Board builder: edit one category at a time, with live tab switching.
// How much of the board is actually written, as a number and a bar. Building a
// 40-question board is a long sit, and "17 of 40" is the difference between
// progress and an endless form.
function builderProgress(d) {
  var total = d.textBoard.length * ROWS_PER_CAT, done = 0;
  d.textBoard.forEach(function (c) {
    c.questions.forEach(function (q) { if ((q.q || q.id) && q.a) done++; });
  });
  var missing = [];
  d.textBoard.forEach(function (c, i) { if (!c.category) missing.push("category " + (i + 1) + " has no title"); });
  if (!d.name) missing.push("the board has no name");
  if (!d.final.category || !d.final.q || !d.final.a) missing.push("Final Jeopardy is not finished");
  return { done: done, total: total, missing: missing,
           ready: done === total && missing.length === 0 };
}
function builderProgressHtml(d) {
  var p = builderProgress(d);
  var pct = p.total ? Math.round((p.done / p.total) * 100) : 0;
  return '<div class="builder-progress">' +
    '<div class="builder-progress-top">' +
      '<span class="builder-progress-num">' + p.done + ' of ' + p.total + ' questions written</span>' +
      '<span class="builder-progress-pct">' + pct + '%</span>' +
    '</div>' +
    '<div class="builder-bar"><div class="builder-bar-fill" style="width:' + pct + '%"></div></div>' +
    (p.ready
      ? '<p class="builder-progress-note builder-ready">Ready to save.</p>'
      : (p.missing.length
          ? '<p class="builder-progress-note">Still to do: ' + esc(p.missing.slice(0, 2).join(", ")) +
            (p.missing.length > 2 ? ", and " + (p.missing.length - 2) + " more" : "") + '.</p>'
          : '')) +
  '</div>';
}
// The board as players will meet it. Tapping a tile jumps to that question,
// which beats hunting through tabs for the one row you left blank.
function builderMiniBoardHtml(d, ci) {
  var n = d.textBoard.length;
  var heads = d.textBoard.map(function (c, i) {
    return '<div class="mini-head' + (i === ci ? ' mini-head-on' : '') + '">' +
      esc(c.category || "Category " + (i + 1)) + '</div>';
  }).join("");
  var cells = "";
  for (var r = 0; r < ROWS_PER_CAT; r++) {
    for (var c = 0; c < n; c++) {
      var q = d.textBoard[c].questions[r];
      var full = (q.q || q.id) && q.a;
      var media = q.id ? "&#9834;" : q.img ? "&#9635;" : "";
      cells += '<button class="mini-tile' + (full ? ' mini-tile-done' : '') +
        (c === ci ? ' mini-tile-col' : '') + '" data-action="builderJump" data-c="' + c + '" data-r="' + r + '"' +
        ' aria-label="' + (full ? "Edit" : "Write") + ' the ' + q.value + ' point question in ' +
          esc(d.textBoard[c].category || "category " + (c + 1)) + '">' +
        '<span class="mini-val">' + q.value + '</span>' +
        (media ? '<span class="mini-media">' + media + '</span>' : '') +
      '</button>';
    }
  }
  return '<div class="mini-board" style="--mini-cols:' + n + '">' + heads + cells + '</div>';
}
function builderSectionHtml(num, title, body, sub) {
  return '<div class="builder-section">' +
    '<div class="builder-sec-head">' +
      '<span class="builder-sec-num">' + num + '</span>' +
      '<span class="builder-sec-title">' + title + '</span>' +
    '</div>' +
    (sub ? '<p class="builder-sec-sub">' + sub + '</p>' : '') +
    body +
  '</div>';
}
function viewBuilder() {
  var bd = state.builder;
  var d = bd.draft;
  var ci = bd.catIndex;
  var col = d.textBoard[ci];

  var nCats = d.textBoard.length;
  // Tabs carry the category's own name once it has one, so a board with eight
  // columns is still navigable.
  var catTabs = d.textBoard.map(function (c, i) {
    var done = c.questions.filter(function (q) { return (q.q || q.id) && q.a; }).length;
    var filled = c.category && done === ROWS_PER_CAT;
    var label = c.category ? esc(c.category) : "Category " + (i + 1);
    return '<button class="builder-cat-tab' + (i === ci ? " builder-cat-tab-active" : "") + '" data-action="builderSelectCat" data-i="' + i + '">' +
      '<span class="builder-tab-name">' + label + '</span>' +
      '<span class="builder-tab-count">' + (filled ? "&#10003;" : done + "/" + ROWS_PER_CAT) + '</span>' +
    '</button>';
  }).join("") +
  (nCats < MAX_CATS
    ? '<button class="builder-cat-tab builder-cat-add" data-action="builderAddCategory" aria-label="Add a category">+</button>'
    : '');

  var clueFields = col.questions.map(function (q, r) {
    var open = state.builder.openRow === r;
    var has = [];
    if (q.img) has.push("picture");
    if (q.aimg) has.push("answer art");
    if (q.id) has.push("clip");
    if (q.hint) has.push("hint");
    if (q.note) has.push("note");
    var done = (q.q || q.id) && q.a;
    return '<div class="builder-clue' + (done ? ' builder-clue-done' : '') + '">' +
      '<div class="builder-clue-head">' +
        '<span>' + q.value + ' pts</span>' +
        '<span class="builder-clue-tags">' + (has.length ? esc(has.join(" &middot; ")) : '') + '</span>' +
      '</div>' +
      '<input class="input builder-input" data-bind="clue:' + r + ':q" placeholder="Question" value="' + esc(q.q) + '" />' +
      '<input class="input builder-input" data-bind="clue:' + r + ':a" placeholder="Answer" value="' + esc(q.a) + '" />' +
      '<button class="builder-more" data-action="builderToggleRow" data-i="' + r + '">' +
        (open ? '&#9650; Hide extras' : '&#9660; Picture, clip, hint&hellip;') +
      '</button>' +
      (open ? builderExtrasHtml(q, r) : '') +
    '</div>';
  }).join("");

  var detailsBody =
      '<label class="lbl">Board name</label>' +
      '<input class="input builder-input" data-bind="name" placeholder="e.g. Studio Ghibli Jeopardy" value="' + esc(d.name) + '" />' +
      '<label class="lbl" style="display:block;margin-top:10px">Tagline</label>' +
      '<input class="input builder-input" data-bind="tagline" placeholder="A short description" value="' + esc(d.tagline) + '" />' +
      '<div class="builder-two">' +
        '<div><label class="lbl">Accent colour</label>' +
          '<div class="builder-swatch-row">' +
            '<span class="builder-swatch" style="background:' + esc(d.accent || DEFAULT_ACCENT) + '"></span>' +
            '<input class="input builder-input" style="margin-top:0" data-bind="accent" placeholder="#a786df" value="' + esc(d.accent) + '" />' +
          '</div></div>' +
        '<div><label class="lbl">Cover image link</label>' +
          '<input class="input builder-input" data-bind="art" placeholder="https://..." value="' + esc(d.art || "") + '" /></div>' +
      '</div>' +
      '<label class="builder-adult">' +
        '<input type="checkbox" id="builderAdult"' + (d.adult ? ' checked' : '') + ' />' +
        '<span>18+ board &mdash; it will live in the After Dark tab, and by entering it players are warned they may see dark humor or images not suited for all ages.</span>' +
      '</label>';

  return '<div class="wrap"><div class="inner builder-inner">' +
    '<h1 class="title" style="font-size:30px">BOARD BUILDER</h1>' +
    '<p class="sub">Build a board from ' + MIN_CATS + ' to ' + MAX_CATS + ' categories. It saves to this device and can be shared by link.</p>' +
    builderProgressHtml(d) +
    '<div class="card">' +
      builderSectionHtml(1, "The board itself", detailsBody) +
      builderSectionHtml(2, "Your board so far",
        builderMiniBoardHtml(d, ci),
        "Tap any tile to jump straight to that question.") +
      builderSectionHtml(3, "Categories",
        '<div class="builder-cat-tabs">' + catTabs + '</div>',
        nCats + ' column' + (nCats === 1 ? '' : 's') + ' on the board.') +
      '<div class="builder-cat-bar">' +
        '<button class="builder-cat-move" data-action="builderMoveCategory" data-i="' + ci + '" data-dir="-1"' +
          (ci === 0 ? ' disabled' : '') + ' aria-label="Move this category left">&larr;</button>' +
        '<span class="builder-cat-pos">Category ' + (ci + 1) + ' of ' + nCats + '</span>' +
        '<button class="builder-cat-move" data-action="builderMoveCategory" data-i="' + ci + '" data-dir="1"' +
          (ci === nCats - 1 ? ' disabled' : '') + ' aria-label="Move this category right">&rarr;</button>' +
        '<button class="builder-cat-del" data-action="builderRemoveCategory" data-i="' + ci + '"' +
          (nCats <= MIN_CATS ? ' disabled title="A board needs at least ' + MIN_CATS + ' categories"' : '') +
          '>Remove</button>' +
      '</div>' +
      '<input class="input builder-input" style="margin-top:10px" data-bind="catName" placeholder="Category title" value="' + esc(col.category) + '" />' +
      '<div class="builder-rows">' + clueFields + '</div>' +

      builderSectionHtml(4, "Final Jeopardy",
        '<input class="input builder-input" data-bind="finalCategory" placeholder="Final category" value="' + esc(d.final.category) + '" />' +

// ---- Millionaire: the screen ----
function milMoneyLabel(n) {
  return "\u00A3" + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}
function milLadderHtml(m) {
  var rows = [];
  for (var i = MIL_LADDER.length - 1; i >= 0; i--) {
    var safe = MIL_SAFE.indexOf(i) !== -1;
    var cls = "mil-rung";
    if (i === m.index && m.stage !== "banked" && m.stage !== "done") cls += " mil-rung-now";
    else if (i < m.index) cls += " mil-rung-won";
    if (safe) cls += " mil-rung-safe";
    rows.push('<div class="' + cls + '">' +
      '<span class="mil-rung-num">' + (i + 1) + '</span>' +
      '<span class="mil-rung-cash">' + milMoneyLabel(MIL_LADDER[i]) + '</span>' +
    '</div>');
  }
  return '<div class="mil-ladder">' + rows.join("") + '</div>';
}
function viewMillionaire() {
  var m = state.mil, pack = milPack();
  if (!m || !pack) { state.phase = "players"; return viewPlayers(); }
  var seat = state.players[m.seat];
  if (!seat) { state.phase = "players"; return viewPlayers(); }

  if (m.stage === "done") return viewMilResults(m, pack);
  if (m.stage === "banked") return viewMilBanked(m, pack, seat);

  var q = milQuestion();
  var options = q.options.map(function (text, i) {
    var cls = "mil-opt";
    if (m.removed.indexOf(i) !== -1) cls += " mil-opt-gone";
    if (m.chosen === i) cls += m.locked ? " mil-opt-locked" : " mil-opt-picked";
    if (m.revealed && i === q.correct) cls += " mil-opt-right";
    else if (m.revealed && m.chosen === i) cls += " mil-opt-wrong";
    var bar = (m.audience && m.removed.indexOf(i) === -1)
      ? '<span class="mil-aud"><span class="mil-aud-fill" style="width:' + (m.audience[i] || 0) + '%"></span>' +
        '<span class="mil-aud-pct">' + (m.audience[i] || 0) + '%</span></span>' : '';
    return '<button class="' + cls + '" data-action="milPick" data-i="' + i + '"' +
        (m.removed.indexOf(i) !== -1 || m.locked || m.stage !== "question" ? ' disabled' : '') + '>' +
      '<span class="mil-letter">' + MIL_LETTERS[i] + '</span>' +
      '<span class="mil-opt-text">' + (m.removed.indexOf(i) !== -1 ? "" : esc(text)) + '</span>' +
      bar +
    '</button>';
  }).join("");

  var lifelines = '<div class="mil-lifelines">' +
    '<button class="mil-ll' + (m.lifelines.fifty ? '' : ' mil-ll-used') + '" data-action="milFifty"' +
      (m.lifelines.fifty && m.stage === "question" && !m.locked ? '' : ' disabled') + '>50:50</button>' +
    '<button class="mil-ll' + (m.lifelines.audience ? '' : ' mil-ll-used') + '" data-action="milAudience"' +
      (m.lifelines.audience && m.stage === "question" && !m.locked ? '' : ' disabled') + '>Ask the room</button>' +
    '<button class="mil-ll' + (m.lifelines.phone ? '' : ' mil-ll-used') + '" data-action="milPhone"' +
      (m.lifelines.phone && m.stage === "question" && !m.locked ? '' : ' disabled') + '>Phone a friend</button>' +
  '</div>';

  var phoneLine = m.phone
    ? '<div class="mil-friend"><strong>Your friend:</strong> ' + esc(m.phone.line) + '</div>' : '';
  var votesLine = (m.audience && state.buzzer.on && state.milVotes && Object.keys(state.milVotes).length)
    ? '<p class="mil-note">That is a real vote from ' + Object.keys(state.milVotes).length + ' phone' +
      (Object.keys(state.milVotes).length === 1 ? '' : 's') + ' in the room.</p>'
    : (m.audience ? '<p class="mil-note">Nobody is on a phone, so that is a stand-in audience.</p>' : '');

  var action;
  if (m.stage === "result") {
    action = '<button class="big-gold" data-action="milNext">' +
      (m.correct
        ? (m.index >= MIL_LADDER.length - 1 ? "Claim the million" : "Next question &mdash; " + milMoneyLabel(milMoney(m.index + 1)))
        : "See what " + esc(seat.name) + " walks away with") + '</button>';
  } else if (m.locked) {
    action = '<p class="mil-locking">Locked in&hellip;</p>';
  } else {
    action = '<div class="mil-actions">' +
        '<button class="' + (m.chosen == null ? "big-disabled" : "big-gold") + '" style="margin-top:0" data-action="milLockIn"' +
          (m.chosen == null ? ' disabled' : '') + '>' +
          (m.chosen == null ? "Pick an answer" : "Final answer: " + MIL_LETTERS[m.chosen]) + '</button>' +
        (m.index > 0
          ? '<button class="confirm-btn-cancel" data-action="milWalk">Walk away with ' + milMoneyLabel(milMoney(m.index - 1)) + '</button>'
          : '') +
      '</div>';
  }

  var menu = renderMenu([
    { label: "Quit to the menu", action: "confirmQuitMil" },
    { label: "Help", action: "openHelp" },
  ]);

  return menu + '<div class="mil-bg"><div class="mil-wrap">' +
    '<div class="mil-top">' +
      '<span class="mil-seat">' + avatarHtml(seat, 13) + ' ' + esc(seat.name) +
        (state.players.length > 1 ? ' &middot; ' + (m.seat + 1) + ' of ' + state.players.length : '') + '</span>' +
      '<span class="mil-playing-for">Playing for ' + milMoneyLabel(milMoney(m.index)) + '</span>' +
    '</div>' +
    '<div class="mil-main">' +
      '<div class="mil-stage">' +
        (q.img ? '<img class="mil-img" src="' + esc(q.img) + '" alt="" referrerpolicy="no-referrer" onerror="this.style.display=&quot;none&quot;">' : '') +
        '<div class="mil-q">' + esc(q.q) + '</div>' +
        '<div class="mil-opts">' + options + '</div>' +
        phoneLine + votesLine +
        (m.revealed && q.note ? '<p class="mil-note">' + esc(q.note) + '</p>' : '') +
        lifelines +
        action +
      '</div>' +
      milLadderHtml(m) +
    '</div>' +
  '</div></div>';
}
function viewMilBanked(m, pack, seat) {
  var w = m.winnings[m.seat] || { amount: 0, how: "wrong" };
  var line = w.how === "won" ? "took the lot." :
             w.how === "walked" ? "walked away." : "got it wrong.";
  var more = m.seat < state.players.length - 1;
  return '<div class="win-bg"><div class="win-wrap">' +
    '<h1 class="win-title">' + esc(seat.name) + ' ' + line + '</h1>' +
    '<p class="win-champ-line">' + milMoneyLabel(w.amount) + '</p>' +
    '<p class="mil-note" style="text-align:center">Reached question ' + (w.reached + 1) + ' of ' + MIL_LADDER.length + '.</p>' +
    '<div class="win-actions">' +
      '<button class="big-gold" style="margin-top:0" data-action="milNextSeat">' +
        (more ? esc(state.players[m.seat + 1].name) + " takes the seat" : "See the results") + '</button>' +
    '</div>' +
  '</div></div>';
}
function viewMilResults(m, pack) {
  var ranked = state.players.map(function (p, i) {
    return { name: p.name, color: p.color, shape: p.shape,
             amount: (m.winnings[i] && m.winnings[i].amount) || 0 };
  }).sort(function (a, b) { return b.amount - a.amount; });
  var top = ranked.length ? ranked[0].amount : 0;
  var medals = ["\uD83E\uDD47", "\uD83E\uDD48", "\uD83E\uDD49"];
  var rows = ranked.map(function (p, i) {
    return '<div class="win-row' + (p.amount === top && top > 0 ? " win-row-champ" : "") + '">' +
      '<span class="win-rank">' + (medals[i] || (i + 1) + ".") + '</span>' +
      '<span class="dot" style="background:' + p.color + '"></span>' +
      '<span class="win-name">' + esc(p.name) + '</span>' +
      '<span class="win-score">' + milMoneyLabel(p.amount) + '</span>' +
    '</div>';
  }).join("");
  return '<div class="win-bg"><div class="win-wrap">' +
    '<h1 class="win-title">\uD83C\uDFC6 ' + esc(pack.name) + '</h1>' +
    '<div class="win-board">' + rows + '</div>' +
    '<div class="win-actions">' +
      '<button class="big-gold" style="margin-top:0" data-action="milPlayAgain">Play again</button>' +
      '<button class="big-disabled" style="margin-top:0;background:#2a2f55;color:#fff" data-action="quitMil">Back to the menu</button>' +
    '</div>' +
  '</div></div>';
}

// ---- Millionaire: choosing a pack ----
function openMilPacks() { state.phase = "milPacks"; state.menuOpen = false; render(); }
function viewMilPacks() {

// ---- Millionaire: the creator ----
function openMilBuilder(existingId) {
  state.menuOpen = false;
  var draft = null;
  if (existingId) {
    var found = milPacks().filter(function (p) { return p.id === existingId; })[0];
    if (found) draft = JSON.parse(JSON.stringify(found));
  }
  state.milBuilder = { draft: draft || blankMilPack(), index: 0, error: "", submitMsg: "" };
  state.phase = "milBuilder";
  render();
}
function milBuilderSelect(i) {
  if (!state.milBuilder) return;
  state.milBuilder.index = Math.max(0, Math.min(MIL_LADDER.length - 1, i));
  render();
}
function milBuilderCorrect(i) {
  if (!state.milBuilder) return;
  state.milBuilder.draft.ladder[state.milBuilder.index].correct = i;
  hap("tap");
  render();
}
function milBuilderSetField(path, value) {
  if (!state.milBuilder) return;
  var d = state.milBuilder.draft;
  if (path === "name") d.name = value;
  else if (path === "tagline") d.tagline = value;
  else if (path === "accent") d.accent = value;
  else {
    var m = path.split(":");           // mil:<field> or milOpt:<n>
    var q = d.ladder[state.milBuilder.index];
    if (m[0] === "mil") q[m[1]] = value;
    else if (m[0] === "milOpt") q.options[+m[1]] = value;
  }
}
function cleanMilPack(p) {
  var out = JSON.parse(JSON.stringify(p));
  out.ladder.forEach(function (q) {
    ["note", "hint", "img"].forEach(function (f) { if (!q[f]) delete q[f]; });
    q.options = q.options.map(function (o) { return String(o == null ? "" : o); });
  });
  if (!out.art) delete out.art;
  return out;
}
function saveMilPack() {
  if (!state.milBuilder) return;
  var d = cleanMilPack(state.milBuilder.draft);
  var err = milPackError(d);
  if (err) { state.milBuilder.error = "Not finished: " + err; render(); return; }
  var list = jfRead(JF_MILPACKS_KEY, []);
  if (!Array.isArray(list)) list = [];
  var idx = list.map(function (p) { return p.id; }).indexOf(d.id);
  if (idx !== -1) list[idx] = d; else list.push(d);
  jfWrite(JF_MILPACKS_KEY, list);
  state.milBuilder = null;
  state.phase = "milPacks";
  render();
}
function deleteMilPack(id) {
  var list = jfRead(JF_MILPACKS_KEY, []);
  if (!Array.isArray(list)) list = [];
  jfWrite(JF_MILPACKS_KEY, list.filter(function (p) { return p.id !== id; }));
  render();
}
function exportMilPack() {
  if (!state.milBuilder) return;
  var d = cleanMilPack(state.milBuilder.draft);
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: "application/json" }));
  a.download = ((d.name || "pack").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "pack") + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}
function submitMilPack() {
  if (!state.milBuilder) return;
  var d = cleanMilPack(state.milBuilder.draft);
  var err = milPackError(d);
  if (err) { state.milBuilder.error = "Finish the pack first: " + err; render(); return; }
  var body = "**Pack:** " + d.name + "\n**Tagline:** " + (d.tagline || "(none)") + "\n" +
    "**Questions:** " + d.ladder.length + " (Millionaire ladder)\n\n" +
    "The pack file has been downloaded to this device. Please drag it into this issue before you submit it.\n";
  exportMilPack();
  state.milBuilder.error = "";
  state.milBuilder.submitMsg = "Your pack file was downloaded. Attach it to the GitHub issue that just opened.";
  openExternal(repoIssueUrl("Millionaire pack: " + d.name, body, "millionaire-pack"));
  render();
}
function milBuilderProgress(d) {
  var done = d.ladder.filter(function (q) {
    return q.q && q.options.every(function (o) { return String(o || "").trim(); });
  }).length;
  return { done: done, total: d.ladder.length, ready: done === d.ladder.length && !!d.name };
}
function viewMilBuilder() {
  var bd = state.milBuilder;
  if (!bd) { state.phase = "milPacks"; return viewMilPacks(); }
  var d = bd.draft, i = bd.index, q = d.ladder[i];
  var p = milBuilderProgress(d);
  var pct = Math.round((p.done / p.total) * 100);

  var rungs = d.ladder.map(function (row, n) {
    var full = row.q && row.options.every(function (o) { return String(o || "").trim(); });
    return '<button class="mil-b-rung' + (n === i ? " mil-b-rung-on" : "") + (full ? " mil-b-rung-done" : "") +
      '" data-action="milBuilderSelect" data-i="' + n + '">' +
      '<span class="mil-b-rung-n">' + (n + 1) + '</span>' +
      '<span class="mil-b-rung-cash">' + milMoneyLabel(MIL_LADDER[n]) + '</span>' +
      (MIL_SAFE.indexOf(n) !== -1 ? '<span class="mil-b-safe">SAFE</span>' : '') +
    '</button>';
  }).join("");

  var opts = q.options.map(function (text, n) {
    return '<div class="mil-b-opt' + (q.correct === n ? " mil-b-opt-right" : "") + '">' +
      '<button class="mil-b-mark" data-action="milBuilderCorrect" data-i="' + n + '"' +
        ' aria-label="Mark ' + MIL_LETTERS[n] + ' as the correct answer">' +
        (q.correct === n ? "&#10003;" : MIL_LETTERS[n]) + '</button>' +
      '<input class="input builder-input" style="margin-top:0" data-milbind="milOpt:' + n + '"' +
        ' placeholder="Answer ' + MIL_LETTERS[n] + '" value="' + esc(text) + '" />' +
    '</div>';
  }).join("");

  return '<div class="wrap"><div class="inner builder-inner">' +
    '<h1 class="title" style="font-size:28px;color:#3da9fc">QUESTION PACK</h1>' +
    '<p class="sub">' + MIL_LADDER.length + ' questions, easiest first. Four answers each, one of them right.</p>' +
    '<div class="builder-progress">' +
      '<div class="builder-progress-top">' +
        '<span class="builder-progress-num">' + p.done + ' of ' + p.total + ' questions written</span>' +
        '<span class="builder-progress-pct">' + pct + '%</span>' +
      '</div>' +
      '<div class="builder-bar"><div class="builder-bar-fill" style="width:' + pct + '%"></div></div>' +
      (p.ready ? '<p class="builder-progress-note builder-ready">Ready to save.</p>'
               : (!d.name ? '<p class="builder-progress-note">Still to do: the pack has no name.</p>' : '')) +
    '</div>' +
    '<div class="card">' +
      builderSectionHtml(1, "The pack",
        '<label class="lbl">Pack name</label>' +
        '<input class="input builder-input" data-milbind="name" placeholder="e.g. Film Buff Millionaire" value="' + esc(d.name) + '" />' +
        '<label class="lbl" style="display:block;margin-top:10px">Tagline</label>' +
        '<input class="input builder-input" data-milbind="tagline" placeholder="A short description" value="' + esc(d.tagline) + '" />') +
      builderSectionHtml(2, "The ladder",
        '<div class="mil-b-ladder">' + rungs + '</div>',
        "Tap a rung to write that question. The easiest is worth " + milMoneyLabel(MIL_LADDER[0]) + ".") +
      builderSectionHtml(3, "Question " + (i + 1) + " &mdash; " + milMoneyLabel(MIL_LADDER[i]),
        '<textarea class="input builder-input mil-b-q" data-milbind="mil:q" rows="3" placeholder="The question">' + esc(q.q) + '</textarea>' +
        '<p class="builder-sec-sub" style="margin-left:0">Tap a letter to mark the right answer.</p>' +
        '<div class="mil-b-opts">' + opts + '</div>' +
        '<input class="input builder-input" data-milbind="mil:hint" placeholder="Hint for the host only (optional)" value="' + esc(q.hint || "") + '" />' +
        '<input class="input builder-input" data-milbind="mil:note" placeholder="Note shown after the answer (optional)" value="' + esc(q.note || "") + '" />' +
        '<input class="input builder-input" data-milbind="mil:img" placeholder="Picture link (optional)" value="' + esc(q.img || "") + '" />',
        MIL_SAFE.indexOf(i) !== -1 ? "This rung is safe: reaching it banks the money for good." : "") +
      (bd.error ? '<p class="err">' + esc(bd.error) + '</p>' : '') +
      '<div style="display:flex;gap:10px;margin-top:18px">' +
        '<button class="confirm-btn-cancel" style="flex:1" data-action="closeMilBuilder">Cancel</button>' +
        '<button class="big-gold" style="flex:1;margin-top:0" data-action="saveMilPack">Save Pack</button>' +
      '</div>' +
      '<button class="big-gold" style="background:#2cb67d;color:#04210f" data-action="submitMilPack">Submit to the Fan Packs</button>' +
      (bd.submitMsg ? '<p class="muted" style="margin-top:8px;color:#7ee2b0">' + esc(bd.submitMsg) + '</p>' : '') +
      '<button class="my-import-link" data-action="exportMilPack">Download this pack as a JSON backup</button>' +
    '</div>' +
  '</div></div>';
}

// ---- Family Feud: the screen ----
function feudBoardHtml(f, r, showAll) {
  var cells = r.answers.map(function (a, i) {
    var up = f.revealed.indexOf(i) !== -1 || showAll;
    return '<div class="feud-slot' + (up ? " feud-slot-up" : "") + '" data-key="fs-' + i + '">' +
      '<span class="feud-rank">' + (i + 1) + '</span>' +
      (up
        ? '<span class="feud-ans">' + esc(a.text) + '</span><span class="feud-pts">' + a.points + '</span>'

    '</div>';
  }).join("");

}
function feudStrikesHtml(f) {
  var marks = "";
  for (var i = 0; i < FEUD_STRIKES; i++) {
    marks += '<span class="feud-x' + (i < f.strikes ? " feud-x-on" : "") + '">&#10007;</span>';
  }
  return '<div class="feud-strikes">' + marks + '</div>';

function viewFeud() {

// ---- Family Feud: teams, packs, creator ----
function openFeudTeams() {
  if (!state.feudTeams || state.feudTeams.length !== 2) state.feudTeams = defaultFeudTeams();
  // players added or removed since last time must not strand an index
  var seen = {};
  state.feudTeams.forEach(function (t) {
    t.members = t.members.filter(function (i) {
      if (!state.players[i] || seen[i]) return false;
      seen[i] = true; return true;
    });
  });
  state.players.forEach(function (p, i) { if (!seen[i]) state.feudTeams[0].members.push(i); });
  state.phase = "feudTeams";
  state.menuOpen = false;
  render();
}
function feudMovePlayer(i) {
  if (!state.feudTeams) return;
  var from = state.feudTeams[0].members.indexOf(i) !== -1 ? 0 : 1;
  var to = from === 0 ? 1 : 0;
  state.feudTeams[from].members = state.feudTeams[from].members.filter(function (x) { return x !== i; });
  if (state.feudTeams[to].members.indexOf(i) === -1) state.feudTeams[to].members.push(i);
  hap("tap");
  render();
}
function viewFeudTeams() {
  var t = state.feudTeams || defaultFeudTeams();

    var chips = team.members.map(function (i) {

        avatarHtml(p, 12) + '<span class="feud-chip-name">' + esc(p.name) + '</span>' +
        '<span class="feud-chip-move">' + (ti === 0 ? "&rarr;" : "&larr;") + '</span>' +

    if (!team.members.length) chips = '<p class="muted" style="margin:8px 0">Nobody yet</p>';
    return '<div class="feud-team-col">' +
      '<p class="feud-team-head">' + esc(team.name) + '</p>' + chips +

  }).join("");
  var ok = t[0].members.length && t[1].members.length;
  return '<div class="wrap"><div class="inner" style="max-width:560px;margin:0 auto">' +
    '<h1 class="title" style="font-size:30px;color:#2cb67d">TEAMS</h1>' +
    '<p class="sub">Tap a name to move it to the other team.</p>' +
    '<div class="card">' +
      '<div class="feud-team-cols">' + cols + '</div>' +
      (ok ? '' : '<p class="err">Both teams need at least one player.</p>') +
      '<button class="' + (ok ? "big-gold" : "big-disabled") + '" data-action="openFeudPacks"' +
        (ok ? '' : ' disabled') + '>Pick a survey pack</button>' +
      '<button class="big-gold" style="background:#2a2f55;color:#fff" data-action="editPlayers">Back</button>' +
    '</div>' +
  '</div></div>';
}
function openFeudPacks() { state.phase = "feudPacks"; state.menuOpen = false; render(); }
function viewFeudPacks() {

  var cards = packs.map(function (p) {

// ---- Family Feud: the creator ----
function openFeudBuilder(existingId) {
  state.menuOpen = false;
  var draft = null;
  if (existingId) {
    var found = feudPacks().filter(function (p) { return p.id === existingId; })[0];
    if (found) draft = JSON.parse(JSON.stringify(found));
  }
  state.feudBuilder = { draft: draft || blankFeudPack(), index: 0, error: "", submitMsg: "" };
  state.phase = "feudBuilder";
  render();
}
function feudBuilderSelect(i) {
  if (!state.feudBuilder) return;
  var d = state.feudBuilder.draft;
  state.feudBuilder.index = Math.max(0, Math.min(d.rounds.length - 1, i));
  render();
}
function feudAddRound() {
  var bd = state.feudBuilder;
  if (!bd || bd.draft.rounds.length >= 8) return;
  bd.draft.rounds.push(blankFeudRound());
  bd.index = bd.draft.rounds.length - 1;
  hap("tap");
  render();
}
function feudRemoveRound(i) {
  var bd = state.feudBuilder;
  if (!bd || bd.draft.rounds.length <= 1) return;
  bd.draft.rounds.splice(i, 1);
  if (bd.index >= bd.draft.rounds.length) bd.index = bd.draft.rounds.length - 1;
  hap("tap");
  render();
}
function feudAddAnswer() {
  var bd = state.feudBuilder;
  if (!bd) return;
  var r = bd.draft.rounds[bd.index];
  if (r.answers.length >= FEUD_MAX_ANSWERS) return;
  r.answers.push({ text: "", points: 0 });
  render();
}
function feudRemoveAnswer(i) {
  var bd = state.feudBuilder;
  if (!bd) return;
  var r = bd.draft.rounds[bd.index];
  if (r.answers.length <= FEUD_MIN_ANSWERS) return;
  r.answers.splice(i, 1);
  render();
}
// A survey reads highest first. Sorting on demand beats making the author
// retype rows into the right order.
function feudSortAnswers() {
  var bd = state.feudBuilder;
  if (!bd) return;
  bd.draft.rounds[bd.index].answers.sort(function (a, b) { return (+b.points || 0) - (+a.points || 0); });
  hap("tap");
  render();
}
function feudBuilderSetField(path, value) {
  if (!state.feudBuilder) return;
  var d = state.feudBuilder.draft;
  if (path === "name") d.name = value;
  else if (path === "tagline") d.tagline = value;
  else if (path === "accent") d.accent = value;
  else {
    var m = path.split(":");
    var r = d.rounds[state.feudBuilder.index];
    if (m[0] === "feudQ") r.q = value;
    else if (m[0] === "feudMul") {
      var mul = parseInt(value, 10);
      r.multiplier = isFinite(mul) && mul > 0 ? Math.min(mul, 5) : 1;
    } else if (m[0] === "feudAns") r.answers[+m[1]].text = value;
    else if (m[0] === "feudPts") {
      var n = parseInt(value, 10);
      r.answers[+m[1]].points = isFinite(n) && n > 0 ? Math.min(n, 999) : 0;
    }
  }
}
function cleanFeudPack(p) {
  var out = JSON.parse(JSON.stringify(p));
  out.rounds.forEach(function (r) {
    r.answers = r.answers.map(function (a) {
      return { text: String(a.text || "").trim(), points: +a.points || 0 };
    });
    if (!r.multiplier || r.multiplier < 1) r.multiplier = 1;
  });
  return out;
}
function saveFeudPack() {
  if (!state.feudBuilder) return;
  var d = cleanFeudPack(state.feudBuilder.draft);
  var err = feudPackError(d);
  if (err) { state.feudBuilder.error = "Not finished: " + err; render(); return; }
  var list = jfRead(JF_FEUDPACKS_KEY, []);
  if (!Array.isArray(list)) list = [];
  var idx = list.map(function (p) { return p.id; }).indexOf(d.id);
  if (idx !== -1) list[idx] = d; else list.push(d);
  jfWrite(JF_FEUDPACKS_KEY, list);
  state.feudBuilder = null;
  state.phase = "feudPacks";
  render();
}
function deleteFeudPack(id) {
  var list = jfRead(JF_FEUDPACKS_KEY, []);
  if (!Array.isArray(list)) list = [];
  jfWrite(JF_FEUDPACKS_KEY, list.filter(function (p) { return p.id !== id; }));
  render();
}
function exportFeudPack() {
  if (!state.feudBuilder) return;
  var d = cleanFeudPack(state.feudBuilder.draft);
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: "application/json" }));
  a.download = ((d.name || "pack").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "pack") + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}
function submitFeudPack() {
  if (!state.feudBuilder) return;
  var d = cleanFeudPack(state.feudBuilder.draft);
  var err = feudPackError(d);
  if (err) { state.feudBuilder.error = "Finish the pack first: " + err; render(); return; }
  var body = "**Pack:** " + d.name + "\n**Tagline:** " + (d.tagline || "(none)") + "\n" +
    "**Surveys:** " + d.rounds.length + "\n\n" +
    "The pack file has been downloaded to this device. Please drag it into this issue before you submit it.\n";
  exportFeudPack();
  state.feudBuilder.error = "";
  state.feudBuilder.submitMsg = "Your pack file was downloaded. Attach it to the GitHub issue that just opened.";
  openExternal(repoIssueUrl("Feud pack: " + d.name, body, "feud-pack"));
  render();
}
function feudBuilderProgress(d) {

}

// Between rounds of a full match: standings, then on to Double Jeopardy.

  return '<div class="win-bg"><div class="win-wrap">' +
    '<h1 class="win-title">ROUND 1 COMPLETE</h1>' +
    '<p class="win-champ-line">Next up: ' + esc(r2 ? r2.name : "Round 2") + ' &mdash; every question worth double, with two Daily Doubles hiding on the board.</p>' +
    '<div class="win-board">' + rows + '</div>' +
    '<div class="win-actions">' +
      '<button class="big-gold" style="margin-top:0" data-action="startRound2">Start Double Jeopardy</button>' +
    '</div>' +
  '</div></div>';
}

// Phone-side buzzer screens: join form, then the full-screen buzz pad.
function phoneWagerInputHtml(bc, sendAction) {
  return '<div style="display:flex;gap:8px;margin-top:8px">' +
    '<input class="input" id="phoneWagerInput" type="number" min="0" placeholder="0" value="' + esc(bc.wagerInput || "") + '" style="flex:1" />' +
    '<button class="btn-gold" data-action="' + sendAction + '">Lock In</button>' +
  '</div>';
}
// Everyone can see where they stand without looking at the big screen.
function phoneScoreboardHtml(bc) {
  var list = (bc.game && bc.game.players) || [];
  if (list.length < 2) return "";
  var ranked = list.slice().sort(function (a, b) { return b.score - a.score; });
  var me = (bc.name || "").toLowerCase();
  return '<div class="phone-scores">' +
    '<p class="phone-scores-head">SCORES</p>' +
    ranked.map(function (pl, i) {
      var mine = String(pl.name).toLowerCase() === me;
      return '<div class="phone-score-row' + (mine ? ' phone-score-me' : '') + '" data-key="ps-' + esc(pl.name) + '">' +
          '<span class="phone-score-rank">' + (i + 1) + '</span>' +
          avatarHtml(pl, 11) +
          '<span class="phone-score-name">' + esc(pl.name) + '</span>' +
          '<span class="phone-score-val">' + pl.score + '</span>' +
        '</div>';
    }).join('') +
  '</div>';
}
// What the phone mirrors from the host: clue text, timer, wheel, your score.
function buzzMirrorHtml(bc) {
  var g = bc.game;
  if (g && g.wheel) {
    var w = g.wheel;
    if (w.stage === "spinning") {
      return '<div class="buzz-mirror">' +
        '<p class="buzz-mirror-cat">' + esc(w.title.toUpperCase()) + (w.target ? ' &middot; TARGET: ' + esc(w.target) : '') + '</p>' +
        '<div class="buzz-wheel-spin"></div>' +
        '<p class="buzz-mirror-q" style="text-align:center">Spinning&hellip;</p>' +
      '</div>';
    }
    return '<div class="buzz-mirror">' +
      '<p class="buzz-mirror-cat">' + esc(w.title.toUpperCase()) + (w.target ? ' &middot; ' + esc(w.target) : '') + '</p>' +
      (w.label ? '<p class="buzz-mirror-value">' + esc(w.label) + '</p>' : '') +
      (w.desc ? '<p class="buzz-mirror-q">' + esc(w.desc) + '</p>' : '') +
    '</div>';
  }
  if (g && g.final) {
    var f = g.final;
    var mine = f.pending && f.pending.toLowerCase() === bc.name.toLowerCase();
    var body;
    if (f.stage === "wager") {
      if (bc.wagerSent) {
        body = '<p class="buzz-mirror-revealed">Wager locked in!</p>';
      } else if (mine) {
        body = '<p class="buzz-mirror-q" style="text-align:center">Your wager (0 &ndash; ' + f.cap + '):</p>' +
          phoneWagerInputHtml(bc, "phoneSendFinalWager");
      } else {
        body = '<p class="buzz-mirror-q" style="text-align:center;color:#8b92c0">Waiting for ' + esc(f.pending || "the next player") + ' to set a wager&hellip;</p>';
      }
    } else if (f.stage === "clue") {
      var answerUi;
      if (bc.answerSent) {
        answerUi = '<p class="buzz-mirror-revealed">Answer locked in' + (bc.answerInput ? ': ' + esc(bc.answerInput) : '') + '</p>' +
          '<button class="confirm-btn-cancel" style="width:100%;margin-top:8px;padding:10px" data-action="editFinalAnswer">Change Answer</button>';
      } else {
        answerUi = '<div style="display:flex;gap:8px;margin-top:10px">' +
          '<input class="input" id="phoneAnswerInput" placeholder="Type your answer" value="' + esc(bc.answerInput || "") + '" style="flex:1;min-width:0" />' +
          '<button class="btn-gold" data-action="phoneSendFinalAnswer">Send</button>' +
        '</div>' +
        '<p class="buzz-timer-note">Your answer goes only to the host.</p>';
      }
      body = (f.q ? '<p class="buzz-mirror-q">' + esc(f.q) + '</p>' : '') + answerUi;
    } else if (f.a) {
      // The host has revealed it, so every phone shows the answer and what
      // everyone actually wrote down.
      var rows = (f.board || []).map(function (pl) {
        var r = pl.result === "right" ? "right" : pl.result === "wrong" ? "wrong" : "skip";
        var mark = r === "right" ? "&#10003;" : r === "wrong" ? "&#10007;" : "&ndash;";
        return '<div class="final-phone-row final-phone-' + r + '" data-key="fp-' + esc(pl.name) + '">' +
            '<span class="final-phone-mark">' + mark + '</span>' +
            '<span class="final-phone-name">' + esc(pl.name) + '</span>' +
            '<span class="final-phone-wrote">' + (pl.wrote ? esc(pl.wrote) : '<em>no answer</em>') + '</span>' +
            '<span class="final-phone-wager">' + (r === "wrong" ? "-" : r === "right" ? "+" : "") + (pl.wager || 0) + '</span>' +
          '</div>';
      }).join('');
      body = (f.q ? '<p class="buzz-mirror-q">' + esc(f.q) + '</p>' : '') +
        '<div class="final-phone-answer">' + esc(f.a) + '</div>' +
        (rows ? '<div class="final-phone-board"><p class="phone-scores-head">WHAT EVERYONE WROTE</p>' + rows + '</div>' : '');
    } else {
      body = '<p class="buzz-mirror-revealed">Answer is up on the host screen</p>';
    }
    return '<div class="buzz-mirror">' +
      '<p class="buzz-mirror-cat">FINAL JEOPARDY' + (f.category ? ' &middot; ' + esc(f.category.toUpperCase()) : '') + '</p>' +
      body +
    '</div>';
  }
  if (g && g.clue) {
    var c = g.clue;
    if (c.wagering) {
      var ddMine = c.dd && c.dd.player && c.dd.player.toLowerCase() === bc.name.toLowerCase();
      var ddBody;
      if (bc.wagerSent) ddBody = '<p class="buzz-mirror-revealed">Wager locked in!</p>';
      else if (ddMine) {
        ddBody = '<p class="buzz-mirror-q" style="text-align:center">' + esc(bc.name) + ', it hit YOUR board. Wager 0 &ndash; ' + c.dd.cap + ':</p>' +
          phoneWagerInputHtml(bc, "phoneSendWager");
      } else {
        ddBody = '<p class="buzz-mirror-q" style="text-align:center">' + esc(c.dd ? c.dd.player : "Someone") + ' is setting a wager&hellip;</p>';
      }
      return '<div class="buzz-mirror">' +
        '<p class="buzz-mirror-cat">' + esc(c.cat.toUpperCase()) + '</p>' +
        '<p class="buzz-mirror-value">DAILY DOUBLE</p>' +
        ddBody +
      '</div>';
    }
    var timerHtml = "";
    if (g.timerDuration && bc.timerAnchor && !c.revealed) {
      var elapsed = Math.min(g.timerDuration, (Date.now() - bc.timerAnchor) / 1000);
      timerHtml = '<div class="timer-track" style="margin:12px 0 2px"><div class="timer-bar" style="--timer-duration:' + g.timerDuration + 's;animation-delay:-' + elapsed.toFixed(2) + 's"></div></div>' +
        '<p class="buzz-timer-note">' + Math.max(0, Math.ceil(g.timerDuration - elapsed)) + 's on the clock</p>';
    }
    var clipHtml = "";
    if (c.isVideo) {
      if (!c.playing) {
        clipHtml = '<p class="buzz-mirror-q" style="text-align:center;color:#8b92c0">The host has not started the clip yet.</p>';
      } else if (bc.playingClip && c.videoId) {
        // Join wherever the host already is, so every phone hears the same
        // moment. The picture is the answer on a "name this opening" clue, so
        // the frame stays fully covered until the host reveals it.
        var startAt = Math.max(0, (c.clipStart || 0) + (c.clipElapsed || 0));
        var src = 'https://www.youtube.com/embed/' + esc(c.videoId) +
          '?autoplay=1&playsinline=1&rel=0&modestbranding=1&controls=0&start=' + startAt;
        clipHtml = '<div class="buzz-clip-frame' + (c.revealed ? '' : ' buzz-clip-hidden') + '">' +
            '<iframe title="Audio question" src="' + src + '" allow="autoplay; encrypted-media"></iframe>' +
            (c.revealed ? '' : '<div class="buzz-clip-veil">' +
                '<span class="buzz-eq"><i></i><i></i><i></i><i></i></span>' +
                '<span class="buzz-clip-veil-text">AUDIO ONLY</span>' +
              '</div>') +
          '</div>' +
          (c.revealed ? '' : '<p class="buzz-timer-note">' +
             (c.clipLimit ? 'Playing ' + c.clipLimit + 's chosen by the host' : 'Playing') +
             ' &middot; video stays hidden until the answer</p>');
      } else if (!bc.audioReady) {
        // First clip of the room: one tap to satisfy the browser's autoplay rule.
        clipHtml = '<button class="big-gold" style="margin-top:10px;padding:14px" data-action="enablePhoneAudio">&#9834;&nbsp; Turn on sound for this phone</button>' +
          '<p class="buzz-timer-note">Tap once and every clip after this starts by itself when the host plays it. Headphones work best.</p>';
      } else {
        clipHtml = '<button class="big-gold" style="margin-top:10px;padding:14px" data-action="phonePlayClip">&#9654;&nbsp; Play the audio</button>' +
          '<p class="buzz-timer-note">Playing on the host screen now &mdash; tap if it did not start here.</p>';
      }
    }
    // Clue art on the phone, for players too far away to read the host screen.
    var imgHtml = c.img
      ? '<img class="buzz-mirror-img" src="' + esc(c.img) + '" alt="" referrerpolicy="no-referrer" onerror="this.classList.add(&quot;img-broken&quot;)">'
      : "";
    // Once the host reveals, the answer is already public, so mirror it too.
    var answerHtml = "";
    if (c.revealed) {
      answerHtml = c.a
        ? '<div class="buzz-answer-box">' + esc(c.a) + '</div>' +
          (c.aimg ? '<img class="buzz-mirror-img" src="' + esc(c.aimg) + '" alt="" referrerpolicy="no-referrer" onerror="this.style.display=&quot;none&quot;">' : '') +
          (c.note ? '<p class="buzz-mirror-note">' + esc(c.note) + '</p>' : '')
        : '<p class="buzz-mirror-revealed">Answer is up on the host screen</p>';
    }
    return '<div class="buzz-mirror">' +
      '<p class="buzz-mirror-cat">' + esc(c.cat.toUpperCase()) + '</p>' +
      '<p class="buzz-mirror-value">' + c.value + ' POINTS</p>' +
      (c.hiddenQ
        ? '<div class="clue-box clue-box-hidden" style="font-size:14px;padding:16px 12px">' +
            '<span class="read-aloud-tag">THE HOST IS READING IT OUT</span>' +
            '<span class="read-aloud-sub">Buzz when you know it.</span>' +
          '</div>'
        : (c.q ? '<p class="buzz-mirror-q">' + esc(c.q) + '</p>' : '')) +
      imgHtml +
      clipHtml +
      timerHtml +
      answerHtml +
    '</div>';
  }
  if (g && g.pick && g.pick.cats && g.pick.cats.length) {
    var myTurn = g.pick.turn && g.pick.turn.toLowerCase() === bc.name.toLowerCase();
    if (!myTurn) {
      return '<div class="buzz-mirror buzz-mirror-idle">' +
        '<p class="buzz-mirror-cat">' + (g.board ? 'NOW PLAYING' : 'ON THE BOARD') + '</p>' +
        (g.board ? '<p class="buzz-mirror-value">' + esc(g.board.name) + '</p>' : '') +
        '<p class="buzz-mirror-q" style="text-align:center;color:#8b92c0">' + esc(g.pick.turn || "Someone") + ' is picking the next question.</p>' +
        (g.board ? '<p class="buzz-timer-note">' + g.board.cluesLeft + ' questions left' + (g.board.round ? ' &middot; Round ' + g.board.round : '') + '</p>' : '') +
      '</div>';
    }
    var usedSet = {};
    (g.pick.used || []).forEach(function (k) { usedSet[k] = true; });
    var grid = g.pick.cats.map(function (cn) { return '<div class="buzz-pick-head">' + esc(cn) + '</div>'; }).join("");
    for (var pr = 0; pr < g.pick.values.length; pr++) {
      for (var pc = 0; pc < g.pick.cats.length; pc++) {
        grid += usedSet[pc + "-" + pr]
          ? '<div class="buzz-pick-tile buzz-pick-used"></div>'
          : '<button class="buzz-pick-tile" data-action="phonePick" data-cat="' + pc + '" data-row="' + pr + '">' + g.pick.values[pr] + '</button>';
      }
    }
    return '<div class="buzz-mirror">' +
      '<p class="buzz-mirror-value">YOUR PICK, ' + esc(bc.name.toUpperCase()) + '</p>' +
      '<div class="buzz-pick-grid" style="grid-template-columns:repeat(' + g.pick.cats.length + ',minmax(0,1fr))">' + grid + '</div>' +
    '</div>';
  }
  var bInfo = g && g.board
    ? '<p class="buzz-mirror-cat">NOW PLAYING</p>' +
      '<p class="buzz-mirror-value">' + esc(g.board.name) + '</p>' +
      (g.board.round ? '<p class="buzz-timer-note">Round ' + g.board.round + '</p>' : '') +
      '<p class="buzz-timer-note">' + g.board.cluesLeft + ' clues left</p>'
    : '';
  return '<div class="buzz-mirror buzz-mirror-idle">' +
    bInfo +
    '<p class="buzz-mirror-q" style="text-align:center;color:#8b92c0">Watch the big screen &mdash; the next question shows up here too.</p>' +
  '</div>';
}
function spectateTimerHtml(bc) {
  var g = bc.game;
  if (!g || !g.timerDuration || !bc.timerAnchor) return "";
  var elapsed = Math.min(g.timerDuration, (Date.now() - bc.timerAnchor) / 1000);
  return '<div class="timer-track" style="max-width:640px;margin:18px auto 0"><div class="timer-bar" style="--timer-duration:' + g.timerDuration + 's;animation-delay:-' + elapsed.toFixed(2) + 's"></div></div>';
}

// Final Jeopardy, driven from the host's phone. The answer is on this device
// from the moment wagers are locked, but stays behind Peek until tapped.
function hostFinalHtml(bc, f) {
  var board = f.board || [];
  var stage = f.stage;
  var head = '<p class="hc-waiting">FINAL JEOPARDY' + (f.category ? ' &middot; ' + esc(f.category.toUpperCase()) : '') + '</p>';

  var peekBtn = f.a
    ? '<button class="hc-peek" data-action="hostPeek">' + (bc.peek ? 'Hide the answer' : 'Peek at the answer') + '</button>' +
      (bc.peek ? '<div class="hc-answer">' + esc(f.a) + '</div>' : '')
    : '';
  var qBlock = f.q ? '<p class="hc-final-q">' + esc(f.q) + '</p>' : '';

  if (stage === "wager") {
    var waitRows = board.map(function (p) {
      return '<div class="hc-score">' +
          '<span class="dot" style="background:' + esc(p.color || '#8b92c0') + '"></span>' +
          '<span class="hc-score-name">' + esc(p.name) + '</span>' +
          '<span class="hc-score-val">' + (p.wagerSet ? 'wagered ' + p.wager : '&hellip;') + '</span>' +
        '</div>';
    }).join('');
    return '<div class="hc-wrap">' + head +
      '<p class="hc-hidden">' + esc(f.pending ? f.pending + ' is setting a wager' : 'Wagers are going in') + '&hellip;</p>' +
      '<div class="hc-scores">' + waitRows + '</div>' +
      peekBtn +
    '</div>';
  }

  if (stage === "clue") {
    var wroteRows = board.map(function (p) {
      return '<div class="hc-score">' +
          '<span class="dot" style="background:' + esc(p.color || '#8b92c0') + '"></span>' +
          '<span class="hc-score-name">' + esc(p.name) + '</span>' +
          '<span class="hc-score-val">' + (p.wrote ? '&#10003; in' : 'writing&hellip;') + '</span>' +
        '</div>';
    }).join('');
    return '<div class="hc-wrap">' + head + qBlock +
      '<div class="hc-scores">' + wroteRows + '</div>' +
      peekBtn +
      '<button class="hc-btn hc-right" data-action="hostFinalReveal">Reveal the answer on the big screen</button>' +
    '</div>';
  }

  // answer stage: judge every player from here
  var judgeRows = board.map(function (p, i) {
    var verdict = p.result === "right"
      ? '<span class="hc-final-right">Correct</span>'
      : p.result === "wrong" ? '<span class="hc-final-wrong">Incorrect</span>'
      : p.result === "skip" ? '<span class="hc-final-skip">Skipped</span>'
      : '<span class="hc-final-btns">' +
          '<button class="hc-btn hc-right hc-mini2" data-action="hostMarkFinal" data-i="' + i + '" data-correct="1">Right</button>' +
          '<button class="hc-btn hc-wrong hc-mini2" data-action="hostMarkFinal" data-i="' + i + '" data-correct="0">Wrong</button>' +
        '</span>';
    return '<div class="hc-final-row" data-key="hf-' + esc(p.name) + '">' +
        '<div class="hc-final-top">' +
          '<span class="dot" style="background:' + esc(p.color || '#8b92c0') + '"></span>' +
          '<span class="hc-score-name">' + esc(p.name) + '</span>' +
          '<span class="hc-final-wager">wagered ' + p.wager + '</span>' +
          '<span class="hc-score-val">' + p.score + '</span>' +
        '</div>' +
        '<p class="hc-final-wrote">' + (p.wrote ? esc(p.wrote) : '<em>no answer written</em>') + '</p>' +
        verdict +
      '</div>';
  }).join('');

  return '<div class="hc-wrap">' + head + qBlock +
    '<div class="hc-answer">' + esc(f.a || '') + '</div>' +
    '<p class="hc-hidden">Mark each player to apply their wager.</p>' +
    judgeRows +
    (f.canUndo ? '<button class="hc-btn hc-undo" data-action="hostUndo">Undo last score change</button>' : '') +
    (f.allMarked
      ? '<button class="hc-btn hc-right" data-action="hostFinishFinal">See the final results</button>'
      : '<button class="hc-btn hc-undo" data-action="hostSkipFinal">Skip the rest &mdash; see the results</button>') +
  '</div>';
}

// ---- Host Control: the host's own phone ----
// Holds the answer at all times, but only shows it when the host taps Peek,
// and Peek never leaves this device — the big screen is unaffected.
function viewHostControl(bc) {
  var g = bc.game || {};
  var c = g.clue;
  var head = '<div class="hc-bar">' +
      '<span class="hc-tag">HOST CONTROL</span>' +
      '<button class="hc-leave" data-action="leaveBuzzer">Leave</button>' +
    '</div>';

  var scores = (g.scores || []).map(function (p, i) {
    return '<div class="hc-score" data-key="hc-' + esc(p.name) + '">' +
        '<span class="dot" style="background:' + esc(p.color || '#8b92c0') + '"></span>' +
        '<span class="hc-score-name">' + esc(p.name) + (i === g.turn ? ' &middot;' : '') + '</span>' +
        '<span class="hc-score-val">' + p.score + '</span>' +
        (c ? '<button class="plus-btn hc-mini" data-action="hostScore" data-i="' + i + '" data-correct="1">+</button>' +
             '<button class="minus-btn hc-mini" data-action="hostScore" data-i="' + i + '" data-correct="0">&minus;</button>' : '') +
      '</div>';
  }).join('');

  // Which board is in play, shown whenever the host is between clues.
  var boardCard = g.board
    ? '<div class="hc-board" style="--pc:' + esc(g.board.accent) + '">' +
        '<span class="hc-board-name">' + esc(g.board.name) + '</span>' +
        (g.board.round ? '<span class="hc-board-round">ROUND ' + g.board.round + '</span>' : '') +
        '<span class="hc-board-left">' + g.board.cluesLeft + ' questions left</span>' +
      '</div>'
    : '';

  // Final Jeopardy gets its own host screen: the answer, what every player
  // wrote, and the Right/Wrong buttons, all from the host's phone.
  if (!c && g.final) return head + hostFinalHtml(bc, g.final);

  if (!c) {
    var waiting = g.final
      ? 'Final Jeopardy &middot; ' + esc((g.final.category || '').toUpperCase())
      : (g.pick && g.pick.turn ? esc(g.pick.turn) + ' is picking' : 'Waiting for the next question');
    var finalPeek = (g.final && bc.peek && g.final.a)
      ? '<div class="hc-answer">' + esc(g.final.a) + '</div>'
      : '';
    // A read-only map of the board so the host can see what is still live.
    var gridHtml = '';
    if (g.pick && g.pick.cats && g.pick.cats.length) {
      var usedSet = {};
      (g.pick.used || []).forEach(function (k) { usedSet[k] = true; });
      var cells = g.pick.cats.map(function (cn) {
        return '<div class="hc-cell hc-cell-head">' + esc(cn) + '</div>';
      }).join('');
      for (var r2 = 0; r2 < (g.pick.values || []).length; r2++) {
        for (var c2 = 0; c2 < g.pick.cats.length; c2++) {
          cells += usedSet[c2 + '-' + r2]
            ? '<div class="hc-cell hc-cell-used"></div>'
            : '<div class="hc-cell">' + g.pick.values[r2] + '</div>';
        }
      }
      gridHtml = '<div class="hc-grid" style="grid-template-columns:repeat(' + g.pick.cats.length + ',minmax(0,1fr))">' + cells + '</div>';
    }
    return head +
      '<div class="hc-wrap">' +
        boardCard +
        '<p class="hc-waiting">' + waiting + '</p>' +
        gridHtml +
        (g.final && g.final.a ? '<button class="hc-peek" data-action="hostPeek">' + (bc.peek ? 'Hide the answer' : 'Peek at the answer') + '</button>' + finalPeek : '') +
        '<div class="hc-scores">' + scores + '</div>' +
        '<button class="hc-btn hc-undo" data-action="hostUndo">Undo last score change</button>' +
      '</div>';
  }

  var peekBlock = bc.peek
    ? '<div class="hc-answer">' + esc(c.a || '(no answer on this question)') + '</div>' +
      (c.note ? '<p class="hc-note">' + esc(c.note) + '</p>' : '')
    : '<p class="hc-hidden">Answer hidden &mdash; only this phone can show it</p>';
  // The hint is a nudge, not the answer, so it sits outside Peek on its own
  // toggle: the host can read a clue out and offer a hint without spoiling it.
  var hintBlock = c.hint
    ? '<button class="hc-hint-btn" data-action="hostHint">' +
        (bc.hint ? 'Hide the hint' : 'Show me a hint') + '</button>' +
      (bc.hint ? '<div class="hc-hint">' + esc(c.hint) + '</div>' : '')
    : '';

  var buzzLine = (g.buzz && g.buzz.winner)
    ? '<div class="hc-buzz">' + esc(g.buzz.winner) + ' buzzed in</div>' : '';

  var judge = (g.buzz && g.buzz.winner && !c.judged)
    ? '<div class="hc-judge">' +
        '<button class="hc-btn hc-right" data-action="hostJudge" data-correct="1">Right</button>' +
        '<button class="hc-btn hc-wrong" data-action="hostJudge" data-correct="0">Wrong</button>' +
      '</div>' : '';

  return head +
    '<div class="hc-wrap">' +
      '<p class="hc-cat">' + esc((c.cat || '').toUpperCase()) + ' &middot; ' + (c.value || 0) + '</p>' +
      '<p class="hc-q">' + esc(c.q || (c.isVideo ? 'Audio or video question' : '')) + '</p>' +
      (c.isVideo
        ? '<div class="clip-ctl-row">' +
            '<span class="clip-ctl-lbl">CLIP</span>' +

function viewSpectate(bc) {
  var g = bc.game || {};
  var backdrop = g.art ?
    '<div class="spectate-backdrop"><img src="' + esc(g.art) + '" alt="" referrerpolicy="no-referrer" onerror="this.style.display=&quot;none&quot;"></div>' : '';
  var body;
  if (g.wheel) {
    var w = g.wheel;
    body = '<p class="spectate-kicker">' + esc(w.title.toUpperCase()) + (w.target ? ' &middot; ' + esc(w.target) : '') + '</p>' +
      (w.stage === "spinning"
        ? '<div class="buzz-wheel-spin" style="width:80px;height:80px;border-width:7px"></div><p class="spectate-note">Spinning&hellip;</p>'
        : '<h1 class="spectate-big">' + esc(w.label || "") + '</h1><p class="spectate-note">' + esc(w.desc || "") + '</p>');
  } else if (g.clue) {
    var c = g.clue;
    if (c.wagering) {
      body = '<p class="spectate-kicker">' + esc(c.cat.toUpperCase()) + '</p>' +
        '<h1 class="spectate-big" style="color:#ffd166">DAILY DOUBLE</h1>' +
        '<p class="spectate-note">' + esc(c.dd ? c.dd.player : "Someone") + ' is setting a wager&hellip;</p>';
    } else {
      var buzzLine = "";
      if (g.buzz && g.buzz.winner) buzzLine = '<p class="spectate-buzzline">' + esc(g.buzz.winner) + ' buzzed in!</p>';
      else if (g.buzz && g.buzz.armed && !c.revealed) buzzLine = '<p class="spectate-note">Buzzers open</p>';
      body = '<p class="spectate-kicker">' + esc(c.cat.toUpperCase()) + ' &middot; ' + c.value + '</p>' +
        (c.q ? '<p class="spectate-clue">' + esc(c.q) + '</p>' : '') +
        (c.img ? '<img class="answer-art" src="' + esc(c.img) + '" alt="" referrerpolicy="no-referrer" onerror="this.style.display=&quot;none&quot;">' : '') +
        (c.isVideo && !c.revealed ? '<p class="spectate-note">' + (c.playing ? "Clip is playing" : "Audio not started yet") + '</p>' : '') +
        spectateTimerHtml(bc) +
        buzzLine +
        (c.revealed && c.a ?
          '<div class="answer-box" style="max-width:680px;margin:22px auto 0">' + esc(c.a) + '</div>' +
          (c.aimg ? '<img class="answer-art" src="' + esc(c.aimg) + '" alt="" referrerpolicy="no-referrer" onerror="this.style.display=&quot;none&quot;">' : '') +
          (c.note ? '<p class="answer-note">' + esc(c.note) + '</p>' : '')
        : (c.revealed ? '<p class="spectate-note">Answer is on the host screen</p>' : ''));
    }
  } else if (g.final) {
    var f = g.final;
    body = '<p class="spectate-kicker">FINAL JEOPARDY' + (f.category ? ' &middot; ' + esc(f.category.toUpperCase()) : '') + '</p>' +
      (f.stage === "wager" ? '<p class="spectate-note">Wagers are being locked in&hellip;</p>' :
       f.stage === "clue" ? '<p class="spectate-clue">' + esc(f.q || "") + '</p><p class="spectate-note">Answers are going in&hellip;</p>' :
       (f.a ? '<div class="answer-box" style="max-width:680px;margin:22px auto 0">' + esc(f.a) + '</div>' : '<p class="spectate-note">Judging&hellip;</p>'));
  } else if (g.win) {
    body = '<h1 class="spectate-big" style="color:#ffd166">' + esc(g.win.title) + '</h1>' +
      '<div class="spectate-standings">' + g.win.rows.map(function (r, i) {
        return '<div class="spectate-standrow' + (i === 0 ? ' spectate-champ' : '') + '">' +
          '<span class="spectate-rank">' + (i + 1) + '</span>' + avatarHtml(r, 16) +
          '<span style="flex:1;text-align:left">' + esc(r.name) + '</span><span>' + r.score + '</span></div>';
      }).join("") + '</div>';
  } else if (g.pick && g.pick.cats && g.pick.cats.length) {
    var usedSet = {};
    (g.pick.used || []).forEach(function (k) { usedSet[k] = true; });
    var grid = g.pick.cats.map(function (cn) { return '<div class="buzz-pick-head" style="font-size:12px">' + esc(cn) + '</div>'; }).join("");
    for (var pr = 0; pr < g.pick.values.length; pr++) {
      for (var pc = 0; pc < g.pick.cats.length; pc++) {
        grid += '<div class="buzz-pick-tile' + (usedSet[pc + "-" + pr] ? ' buzz-pick-used' : '') + '" style="font-size:20px;padding:16px 0;cursor:default">' +
          (usedSet[pc + "-" + pr] ? '' : g.pick.values[pr]) + '</div>';
      }
    }
    body = '<div class="buzz-pick-grid" style="grid-template-columns:repeat(' + g.pick.cats.length + ',minmax(0,1fr));max-width:820px;margin:0 auto;gap:6px">' + grid + '</div>' +
      '<p class="spectate-note" style="margin-top:16px">' + esc(g.pick.turn || "Someone") + ' is picking</p>';
  } else {
    body = '<p class="spectate-note">Waiting for the game&hellip;</p>';
  }
  var scoreStrip = (g.players || []).map(function (pl) {
    return '<span class="spectate-score-chip">' + avatarHtml(pl, 11) + esc(pl.name) + ' ' + pl.score + '</span>';
  }).join("");
  return '<div class="spectate">' + backdrop +
    '<span class="spectate-chip">Room <span class="buzz-room-code">' + esc(bc.code) + '</span>' +
      '<button data-action="leaveBuzzer" aria-label="Leave">&times;</button></span>' +
    '<div class="spectate-body">' + body + '</div>' +
    (scoreStrip ? '<div class="spectate-scores">' + scoreStrip + '</div>' : '') +
  '</div>';
}
function viewBuzzer() {

        '<span class="buzz-score">' + (myScore == null ? "&mdash;" : myScore) + '<em>pts</em></span>' +
      '</div>' +
      buzzMirrorHtml(bc) +
      phoneScoreboardHtml(bc) +
      '<button class="' + cls + '" data-action="sendBuzz">' + label + '</button>' +
      '<p class="muted" style="margin:0">' + (bc.buzzState === "armed" ? "Tap the moment you know it!" : "The button lights up when a question opens.") + '</p>' +
      '<button class="confirm-btn-cancel" style="padding:12px 22px" data-action="leaveBuzzer">Leave Room</button>' +
    '</div>';
  }
  var connecting = bc.stage === "connecting";
  return '<div class="wrap"><div class="inner" style="max-width:420px;margin:0 auto">' +
    '<h1 class="title" style="font-size:34px">BUZZ IN</h1>' +
    '<p class="sub">Enter the room code shown on the host screen.</p>' +
    '<div class="card">' +
      '<label class="lbl">Room code</label>' +
      '<input class="input" id="buzzCodeInput" maxlength="4" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:6px;font-weight:900;text-align:center" value="' + esc(bc.code) + '"' + (connecting ? " disabled" : "") + ' />' +
      '<label class="lbl" style="display:block;margin-top:12px">Your name</label>' +
      '<input class="input" id="buzzNameInput" placeholder="Same name as on the host screen" value="' + esc(bc.name) + '"' + (connecting ? " disabled" : "") + ' />' +
      '<div class="shape-row" style="margin-top:10px">' + AVATAR_SHAPES.map(function (sh) {
        var sel = (bc.shape || "circle") === sh;
        return '<button class="shape-pick' + (sel ? ' shape-pick-sel' : '') + '" data-action="pickBuzzShape" data-shape="' + sh + '">' +
          avatarHtml({ shape: sh, color: sel ? '#ffd166' : '#8b92c0' }, 16) + '</button>';
      }).join('') + '</div>' +
      (bc.msg ? '<p class="err">' + esc(bc.msg) + '</p>' : '') +
      '<button class="big-gold" data-action="submitBuzzerJoin"' + (connecting ? " disabled" : "") + '>' + (connecting ? "Connecting&hellip;" : "Join Room") + '</button>' +
      '<button class="big-gold" style="background:#3da9fc;color:#04203a" data-action="watchAsTv"' + (connecting ? " disabled" : "") + '>Watch on TV (no buzzer)</button>' +
      '<div class="host-claim">' +
        '<p class="host-claim-lbl">Hosting from this phone?</p>' +
        '<div class="host-claim-row">' +
          '<input class="input" id="hostPinInput" maxlength="4" inputmode="numeric" placeholder="PIN" value="' + esc(bc.hostPin || "") + '"' + (connecting ? " disabled" : "") + ' />' +
          '<button class="btn-gold" data-action="controlAsHost"' + (connecting ? " disabled" : "") + '>Host Control</button>' +
        '</div>' +
        '<p class="host-claim-hint">The 4-digit PIN is on the host screen. Host Control shows you the answers privately.</p>' +
      '</div>' +
      '<button class="big-gold" style="background:#2a2f55;color:#aab0d8" data-action="leaveBuzzer">Back</button>' +
    '</div>' +
  '</div></div>';
}

// Host lobby: giant room code, join instructions, and live player list.

  '</button>';

      avatarHtml({ shape: p.shape, color: on ? "#0b0f24" : p.color }, 11) +
      '<span class="chip-name">' + esc(teamModeOn() ? teamLabel(teamOf(i)) : p.name) + '</span>: ' + p.score +
      (state.roomRules.streakBonus && (p.streak || 0) >= 3 ? '<span class="chip-fx chip-fx-good" title="On a streak">STREAK ' + p.streak + '</span>' : '') +
      (p.immune ? '<span class="chip-fx chip-fx-good" title="Immune to the next negative effect">IMM</span>' : '') +
      (p.skipNextTurn ? '<span class="chip-fx chip-fx-bad" title="Skips their next pick">SKIP</span>' : '') +
    '</div>';
  }).join("");

  var heads = categories.map(function (col) {
    return '<div class="cat-head" style="background:' + (categoryHasVideo(col) ? "#7a2f6f" : "#3a2f8f") + '">' + esc(col.category) + '</div>';
  }).join("");

  var tiles = "";
  for (var row = 0; row < 5; row++) {
    for (var ci = 0; ci < categories.length; ci++) {
      var col = categories[ci];
      var isVideoTile = !!col.questions[row].id;
      var key = ci + "-" + row;
      var isUsed = !!state.used[key];
      var val = col.questions[row].value * roundMultiplier();
      var bgc = isUsed ? "#10142e" : (isVideoTile ? "#3a1d3f" : "#1d2455");
      var fgc = isUsed ? "#2a2f55" : gold;
      // diagonal cascade: delay grows with row + column so tiles sweep in
      var casc = cascade ? ' tile-cascade" style="--d:' + (0.028 * (row + ci)).toFixed(3) + 's;' : '" style="';

  var menu = renderMenu(withUndo(gameMenuItems(true)));

  return menu + stageBackdropHtml() + '<div class="board-screen" style="padding:' + (state.menuOpen ? "160px" : "16px") + ' 12px 16px"><div class="board-screen-inner">' +

// ---- render + events ----
// Phases that need a live board cannot survive without one. Rather than
// rendering into nothing, step back to a screen that makes sense.
function ensureConsistentState() {
  // Any hole or junk entry in the player list poisons every p.name/p.score
  // read downstream, so scrub it once here rather than guarding 50 call sites.
  if (Array.isArray(state.players)) {
    var clean = state.players.filter(function (p) { return p && typeof p.name === "string"; });
    if (clean.length !== state.players.length) state.players = clean;
  } else {
    state.players = [];
  }
  var needsBoard = state.phase === "board" || state.phase === "question" ||
                   state.phase === "final" || state.phase === "interlude";
  // Removing every player mid-game used to crash these screens, because they
  // read state.players[state.turn] directly. Send the host back to set-up.
  if (needsBoard && (!state.players || !state.players.length)) {
    state.active = null;
    state.wagering = false;
    state.revealed = false;
    state.phase = "players";
    return;
  }
  // the turn pointer can also outlive the player it pointed at
  if (state.players && state.players.length && state.turn >= state.players.length) {
    state.turn = 0;
  }
  if (needsBoard && !currentBoard()) {
    state.active = null;
    state.wagering = false;
    state.revealed = false;
    state.wager = null;
    state.phase = (state.players && state.players.length) ? "boards" : "players";
    return;
  }
  // an out-of-range clue reference is the same problem one level down
  if (state.phase === "question" && state.active) {
    var b = currentBoard();
    var col = b && b.textBoard[state.active.catKey];
    if (!col || !col.questions || !col.questions[state.active.qIndex]) {
      state.active = null;
      state.wagering = false;
      state.phase = "board";
    }
  }
}
function render() {
  var root = document.getElementById("root");
  ensureConsistentState();
  if (modalOpen()) stopShake();  // never leave a shake running under a sheet
  flipCapture(); // measure the outgoing DOM before it is replaced
  var html;
  if (state.wheel) html = viewWheel();
  else if (state.phase === "millionaire") html = viewMillionaire();
  else if (state.phase === "milBuilder") html = viewMilBuilder();
  else if (state.phase === "milPacks") html = viewMilPacks();
  else if (state.phase === "feud") html = viewFeud();
  else if (state.phase === "feudTeams") html = viewFeudTeams();
  else if (state.phase === "feudPacks") html = viewFeudPacks();
  else if (state.phase === "feudBuilder") html = viewFeudBuilder();
  else if (state.phase === "buzzer") html = viewBuzzer();
  else if (state.phase === "hostRoom") html = viewHostRoom();
  else if (state.phase === "interlude") html = viewInterlude();
  else if (state.phase === "stats") html = viewStats();
  else if (state.phase === "builder") html = viewBuilder();
  else if (state.phase === "players") html = viewPlayers();
  else if (state.phase === "boards") html = state.previewBoardId ? viewBoardPreview() : viewBoards();
  else if (state.phase === "final") html = viewFinal();
  else if (state.phase === "question" && state.active) html = viewQuestion();
  else if (state.phase === "board" && isAllUsed()) {
    html = viewWin();
    if (!state.endSoundPlayed) { state.endSoundPlayed = true; sndEnd(); fireConfetti(3200); }
  }
  else html = viewBoard();
  if (state.phase === "board" && !state.wheel) html += viewManagePlayers();
  root.innerHTML = html + renderConfirm() + renderImportPrompt() + renderAdultGate() + renderHelp();
  flipPlay(); // slide anything that moved from where it used to be
  saveGameSnapshot();
  broadcastSync();
  syncThinkLoop();

  // The genre strip scrolls on phones, so keep the selected tab in view.
  var activeTabEl = document.querySelector(".boards-tab-active");
  if (activeTabEl && activeTabEl.scrollIntoView) {
    try { activeTabEl.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" }); } catch (e) {}
  }
  var nameField = document.getElementById("nameInput");
  if (nameField) {
    nameField.addEventListener("input", function (e) { state.nameInput = e.target.value; });
    nameField.addEventListener("keydown", function (e) { if (e.key === "Enter") addPlayer(); });
  }
  var phoneAnswerField = document.getElementById("phoneAnswerInput");
  if (phoneAnswerField) {
    phoneAnswerField.addEventListener("input", function (e) { if (state.buzzClient) state.buzzClient.answerInput = e.target.value; });
    phoneAnswerField.addEventListener("keydown", function (e) { if (e.key === "Enter") phoneSendFinalAnswer(); });

  }
  if (state.builder && state.builder.focusRow != null && state.builder.focusRow >= 0) {
    var jumped = document.querySelector('[data-bind="clue:' + state.builder.focusRow + ':q"]');
    state.builder.focusRow = null;
    if (jumped) {
      try { jumped.focus({ preventScroll: true }); } catch (e) { jumped.focus(); }
      if (jumped.scrollIntoView) jumped.scrollIntoView({ block: "center", behavior: reducedMotion() ? "auto" : "smooth" });
    }
  }
  var searchField = document.getElementById("searchInput");
  if (searchField) {
    // update results and toggle search mode in place so the input keeps focus
    searchField.addEventListener("input", function (e) {
      state.searchQuery = e.target.value;
      var resEl = document.getElementById("searchResults");
      if (resEl) resEl.innerHTML = searchResultsHtml();
      var wrapEl = document.getElementById("boardsWrap");
      if (wrapEl) wrapEl.classList.toggle("searching", state.searchQuery.trim().length >= 2);
    });
  }
  var wagerField = document.getElementById("wagerInput");
  if (wagerField) {
    wagerField.addEventListener("input", function (e) { state.wagerInput = e.target.value; });
    wagerField.addEventListener("keydown", function (e) { if (e.key === "Enter") submitWager(); });

  if (editNameField) {
